<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Node Config</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="hero"><div class="eyebrow">BLE Commissioning</div><h1>Node Config</h1><p>Configure a water-sensor node.</p></section><section class="notice"><button id="connect" class="button">Connect to Node</button><p id="status">Not connected.</p></section><section class="notice"><h2>Node settings</h2><label>Node ID<br><input id="node" type="number" value="1"></label><br><label>Hub ID<br><input id="hub" value="HUB01"></label><br><label>Network ID<br><input id="network" value="WATER01"></label><br><label>Reporting interval (seconds)<br><input id="interval" type="number" value="300"></label><br><label>LoRa TX power (dBm)<br><input id="power" type="number" value="14"></label><br><button id="save" class="button" disabled>Save Node Config</button></section><p><a href="index.html">← Home</a></p></main><script src="ble.js"></script><script>const formFields=['node','hub','network','interval','power']; document.getElementById('connect').onclick=()=>BleConfig.connect('node'); document.getElementById('save').onclick=()=>BleConfig.save(formFields.map(id=>[id,document.getElementById(id).value]));</script></body></html>
