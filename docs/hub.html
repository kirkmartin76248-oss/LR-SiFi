<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub Config</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="hero"><div class="eyebrow">BLE Commissioning</div><h1>Hub Config</h1><p>Configure the XIAO ESP32-C6 hub.</p></section><section class="notice"><button id="connect" class="button">Connect to Hub</button><p id="status">Not connected.</p></section><section class="notice"><h2>Hub settings</h2><label>Hub ID<br><input id="hub" value="HUB01"></label><br><label>Network ID<br><input id="network" value="WATER01"></label><br><label>Wi-Fi SSID<br><input id="ssid"></label><br><label>Wi-Fi password<br><input id="password" type="password"></label><br><label>Google Apps Script URL<br><input id="url"></label><br><label>LoRa TX power (dBm)<br><input id="power" type="number" value="14"></label><br><button id="save" class="button" disabled>Save Hub Config</button></section><p><a href="index.html">← Home</a></p></main><script src="ble.js"></script><script>const formFields=['hub','network','ssid','password','url','power']; document.getElementById('connect').onclick=()=>BleConfig.connect('hub'); document.getElementById('save').onclick=()=>BleConfig.save(formFields.map(id=>[id,document.getElementById(id).value]));</script></body></html>
